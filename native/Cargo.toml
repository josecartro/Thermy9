[package]
name = "thermy9"
version = "1.0.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Unofficial label studio for compatible Paperang printers"
default-run = "thermy9"

[[bin]]
name = "thermy9"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:btleplug", "dep:tokio", "dep:futures"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.48"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
base64 = "0.22"
regex = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
btleplug = { version = "0.11", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"], optional = true }
futures = { version = "0.3", optional = true }
crc32fast = "1"

[profile.release]
strip = true
opt-level = "s"
